version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # These packages now gate their newest majors on `node >= 22`, while this
      # project still supports and tests Node 20 (engines.node >= 20, CI matrix
      # 20/22). npm "latest" is therefore not installable under our contract:
      # better-sqlite3@13 segfaults on Node 20 (native ABI), and the others
      # declare Node 22-only. We pinned the newest Node-20-safe releases by hand
      # (see the commit "upgrade runtime deps to the newest Node-20-safe
      # versions"). Ignore these majors until engines.node and the CI matrix are
      # raised together in one deliberate change — then remove these rules.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'better-sqlite3'
        update-types: ['version-update:semver-major']
      - dependency-name: 'openai'
        update-types: ['version-update:semver-major']
      - dependency-name: '@google-cloud/text-to-speech'
        update-types: ['version-update:semver-major']
    groups:
      # Keep dev-only tooling noise in a single PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Group compatible runtime bumps so CI cost stays low.
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
