version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # @types/node must match the runtime we actually support and test
      # (engines.node >= 20, CI matrix 20/22). Typing against a newer Node
      # would type-check APIs that do not exist at runtime. Raise this
      # together with engines.node and the CI matrix, in one deliberate change.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # better-sqlite3 >= 12 requires node >= 22, while this project still
      # supports and tests Node 20. On Node 20 it installs with an EBADENGINE
      # warning and then segfaults (exit 139) because the prebuilt native
      # binary is built against a newer ABI. Ignore majors until engines.node
      # and the CI matrix are raised together.
      - dependency-name: 'better-sqlite3'
        update-types: ['version-update:semver-major']
    groups:
      # Keep dev-only tooling noise in a single PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # Group compatible runtime bumps so CI cost stays low.
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
